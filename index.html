        // ============================================================
        // CORE UTILITIES
        // ============================================================
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, function(tag) {
                const charsToReplace = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
                return charsToReplace[tag] || tag;
            });
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
        }

        function safeDate(dateString) {
            if (!dateString) return '-';
            try {
                const d = new Date(dateString);
                return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch(e) { return escapeHTML(dateString); }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${escapeHTML(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showFullPageLoading() { document.getElementById('fullPageLoader').style.display = 'flex'; }
        function hideFullPageLoading() { document.getElementById('fullPageLoader').style.display = 'none'; }
        
        function getSectionLoading() {
            return `<div class="section-loader"><div class="spinner"></div></div>`;
        }

        // ============================================================
        // API COMMUNICATION (GAS RUN)
        // ============================================================
        function gasRun(functionName) {
            var args = Array.prototype.slice.call(arguments, 1);
            
            if (isCanvasMode) {
                return runMock(functionName, args);
            }

            return new Promise(function(resolve, reject) {
                // Eksekusi jika dalam GAS environment
                if (window.google && google.script && google.script.run) {
                    var runner = google.script.run
                        .withSuccessHandler(function(res) {
                            if(res && res.sessionExpired) handleSessionExpired();
                            resolve(res);
                        })
                        .withFailureHandler(function(err) {
                            console.error("GAS Error:", err);
                            reject(new Error('Koneksi server gagal.'));
                        });
                    runner[functionName].apply(runner, args);
                } 
                // Eksekusi eksternal via Fetch (GitHub/Cloudflare)
                else if (CONFIG.SCRIPT_URL !== "") {
                     fetch(CONFIG.SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: functionName, args: args }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' } // Text plain avoids CORS preflight in some GAS setups
                    })
                    .then(res => res.json())
                    .then(res => {
                         if(res && res.sessionExpired) handleSessionExpired();
                         resolve(res);
                    })
                    .catch(err => reject(new Error('Koneksi API eksternal gagal.')));
                } else {
                    reject(new Error('Layanan Google Apps Script tidak tersedia dan CONFIG.SCRIPT_URL kosong.'));
                }
            });
        }

        function runMock(func, args) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    let res = { success: false, message: 'Fungsi tidak ditemukan di mock' };
                    const token = args[0];
                    
                    if (func === 'loginUser') {
                        const [email, pwd] = args;
                        const user = mockDB.users.find(u => u.username === email && u.passwordHash === pwd);
                        if (user) {
                            res = { success: true, token: 'mock-token-123', user: { id: user.id, name: user.name, role: user.role, permissions: ['dashboard.view', 'member.view', 'member.edit', 'invoice.view', 'invoice.create'] } };
                        } else {
                            res = { success: false, message: 'Username atau password salah' };
                        }
                    } else if (func === 'getDashboardData') {
                        res = { success: true, data: mockDB.stats };
                    } else if (func === 'getAnggota') {
                        res = { success: true, data: mockDB.anggota };
                    } else if (func === 'saveAnggota') {
                        const [, data] = args;
                        if(data.id) {
                           const idx = mockDB.anggota.findIndex(a=>a.id===data.id);
                           if(idx > -1) mockDB.anggota[idx] = {...mockDB.anggota[idx], ...data};
                        } else {
                           data.id = 'MEM-' + Date.now();
                           mockDB.anggota.push(data);
                        }
                        res = { success: true, message: 'Data anggota tersimpan' };
                    }
                    resolve(res);
                }, 500);
            });
        }

        // ============================================================
        // AUTHENTICATION & SESSION
        // ============================================================
        function checkLoginState() {
            const savedToken = localStorage.getItem('inv_token');
            const savedUser = localStorage.getItem('inv_user');
            
            if (savedToken && savedUser) {
                state.token = savedToken;
                state.user = JSON.parse(savedUser);
                state.permissions = state.user.permissions || [];
                showAppView();
            } else {
                showLoginView();
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnLogin');
            
            if(!user || !pass) return showToast('Isi semua field', 'warning');
            
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Proses...`;
            btn.disabled = true;

            gasRun('loginUser', user, pass)
                .then(res => {
                    if (res.success) {
                        state.token = res.token;
                        state.user = res.user;
                        state.permissions = res.user.permissions || [];
                        localStorage.setItem('inv_token', res.token);
                        localStorage.setItem('inv_user', JSON.stringify(res.user));
                        showAppView();
                        showToast('Login berhasil', 'success');
                    } else {
                        showToast(res.message || 'Login gagal', 'error');
                    }
                })
                .catch(err => showToast(err.message, 'error'))
                .finally(() => {
                    btn.innerHTML = `<span>Masuk</span>`;
                    btn.disabled = false;
                });
        });

        window.handleLogout = function() {
            showFullPageLoading();
            gasRun('logoutUser', state.token).finally(() => {
                state.token = null;
                state.user = null;
                localStorage.removeItem('inv_token');
                localStorage.removeItem('inv_user');
                showLoginView();
                hideFullPageLoading();
            });
        };

        function handleSessionExpired() {
            state.token = null;
            state.user = null;
            localStorage.removeItem('inv_token');
            localStorage.removeItem('inv_user');
            showLoginView();
            showToast('Session telah berakhir. Silakan login kembali.', 'error');
        }

        function hasPermission(perm) {
            if(state.user && state.user.role === 'Super Admin') return true;
            return state.permissions.includes(perm);
        }

            document.getElementById('appView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            hideFullPageLoading();
        }

            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('appView').classList.remove('hidden');
            
            // Setup User Info
            document.getElementById('userNameDisplay').textContent = state.user.name;
            document.getElementById('userRoleDisplay').textContent = state.user.role;
            document.getElementById('userInitial').textContent = state.user.name.charAt(0).toUpperCase();

            navigate('dashboard');
            hideFullPageLoading();

                         </a>`;

            html += `<div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 mt-2 px-4">Menu Utama</div>`;
            addMenu('dashboard', 'fa-home', 'Dashboard');
            
            if(hasPermission('member.view')) {
                html += `<div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 mt-4 px-4">Anggota</div>`;
                addMenu('anggota', 'fa-users', 'Data Anggota', 'member.view');
            }
            
            if(hasPermission('invoice.view') || hasPermission('receipt.view')) {
                html += `<div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 mt-4 px-4">Transaksi</div>`;
                addMenu('invoice', 'fa-file-invoice', 'Invoice', 'invoice.view');

            if(hasPermission('settings.view') || state.user.role === 'Super Admin') {
                html += `<div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 mt-4 px-4">Pengaturan</div>`;
                addMenu('settings', 'fa-cog', 'Pengaturan Sistem', 'settings.view');
            }

            menu.innerHTML = html;
        }

        window.navigate = function(pageId) {
            state.activePage = pageId;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

                document.getElementById('sidebar').classList.add('sidebar-hidden');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            }

            const reqPage = pageId;
            
            switch(pageId) {
                case 'dashboard':
                    document.getElementById('pageTitle').textContent = 'Dashboard';
                    loadDashboard(reqPage);
                    break;
                case 'anggota':

        // DASHBOARD MODULE
        // ============================================================
        function loadDashboard(reqPage) {
            gasRun('getDashboardData', state.token)
                .then(res => {
                    if (state.activePage !== reqPage) return;
                    if (res.success) {
                        renderDashboard(res.data);
                    } else {
                        document.getElementById('mainContent').innerHTML = `<div class="text-red-500 p-4">${res.message}</div>`;
                    }
                })
                .catch(err => {
                    if (state.activePage !== reqPage) return;
                    document.getElementById('mainContent').innerHTML = `<div class="text-red-500 p-4">Error: ${err.message}</div>`;
                });
        }

        function renderDashboard(data) {
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
                        <div class="bg-blue-100 text-blue-600 h-12 w-12 rounded-lg flex items-center justify-center text-xl mr-4"><i class="fas fa-users"></i></div>
                        <div><p class="text-sm text-gray-500 font-medium">Total Anggota</p><h3 class="text-2xl font-bold text-gray-800">${data.totalAnggota || 0}</h3></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
                        <div class="bg-green-100 text-green-600 h-12 w-12 rounded-lg flex items-center justify-center text-xl mr-4"><i class="fas fa-file-invoice"></i></div>
                        <div><p class="text-sm text-gray-500 font-medium">Invoice Lunas</p><h3 class="text-2xl font-bold text-gray-800">${data.paid || 0}</h3></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
                        <div class="bg-yellow-100 text-yellow-600 h-12 w-12 rounded-lg flex items-center justify-center text-xl mr-4"><i class="fas fa-clock"></i></div>
                        <div><p class="text-sm text-gray-500 font-medium">Belum Dibayar</p><h3 class="text-2xl font-bold text-gray-800">${data.unpaid || 0}</h3></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
                        <div class="bg-purple-100 text-purple-600 h-12 w-12 rounded-lg flex items-center justify-center text-xl mr-4"><i class="fas fa-wallet"></i></div>
                        <div><p class="text-sm text-gray-500 font-medium">Total Pendapatan</p><h3 class="text-xl font-bold text-gray-800">${formatRupiah(data.revenue)}</h3></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Aktivitas Terbaru</h3>
                    <div class="text-gray-500 text-sm text-center py-8 border-2 border-dashed border-gray-200 rounded-lg">
                        Belum ada aktivitas yang tercatat.
                    </div>
                </div>
            `;
        }

        // ============================================================
        // ANGGOTA MODULE (CRUD & Optimistic UI)
        // ============================================================
        function loadAnggota(reqPage) {
            gasRun('getAnggota', state.token)
                .then(res => {
                    if (state.activePage !== reqPage) return;
                    if (res.success) {
                        state.data.anggota = res.data;
                        renderAnggotaList();
                    } else {
                        document.getElementById('mainContent').innerHTML = `<div class="text-red-500 p-4">${res.message}</div>`;
                    }
                })
                .catch(err => {
                    if (state.activePage !== reqPage) return;
                    document.getElementById('mainContent').innerHTML = `<div class="text-red-500 p-4">Error: ${err.message}</div>`;
                });
        }

        function renderAnggotaList() {
            const content = document.getElementById('mainContent');
            const canCreate = hasPermission('member.create');
            
            let html = `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="relative w-full sm:w-64">
                            <input type="text" id="searchAnggota" placeholder="Cari anggota..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                            <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
                        </div>
                        ${canCreate ? `<button onclick="openFormAnggota()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2"><i class="fas fa-plus"></i> Tambah Anggota</button>` : ''}
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-gray-50 text-gray-600">
                                <tr>
                                    <th class="px-6 py-3 font-semibold">Nama</th>
                                    <th class="px-6 py-3 font-semibold">Jenis</th>
                                    <th class="px-6 py-3 font-semibold">Kontak</th>
                                    <th class="px-6 py-3 font-semibold">Status</th>
                                    <th class="px-6 py-3 font-semibold text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="anggotaTableBody" class="divide-y divide-gray-100">
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            content.innerHTML = html;
            
            document.getElementById('searchAnggota').addEventListener('input', (e) => {
                renderAnggotaRows(e.target.value);
            });
            
            renderAnggotaRows();
        }

        function renderAnggotaRows(search = '') {
            const tbody = document.getElementById('anggotaTableBody');
            let data = state.data.anggota;
            
            if(search) {
                const s = search.toLowerCase();
                data = data.filter(a => String(a.nama).toLowerCase().includes(s) || String(a.email).toLowerCase().includes(s));
            }

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">Tidak ada data anggota ditemukan.</td></tr>`;
                return;
            }

            const canEdit = hasPermission('member.edit');
            const canDelete = hasPermission('member.delete');

            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-gray-50 ${item._isSyncing ? 'optimistic-syncing' : ''}">
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900">${escapeHTML(item.nama)}</div>
                        <div class="text-xs text-gray-500">${escapeHTML(item.id || '-')}</div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">${escapeHTML(item.jenis)}</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-gray-900">${escapeHTML(item.phone || '-')}</div>
                        <div class="text-gray-500 text-xs">${escapeHTML(item.email || '-')}</div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${item.status === 'Aktif' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${escapeHTML(item.status)}</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        ${canEdit ? `<button onclick="openFormAnggota('${item.id}')" class="text-blue-600 hover:text-blue-800 p-1 mx-1 transition" title="Edit"><i class="fas fa-edit"></i></button>` : ''}
                        ${canDelete ? `<button onclick="confirmDeleteAnggota('${item.id}')" class="text-red-600 hover:text-red-800 p-1 mx-1 transition" title="Hapus"><i class="fas fa-trash"></i></button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        // Form Modal Anggota
        window.openFormAnggota = function(id = null) {
            let item = { nama: '', jenis: 'Utama', status: 'Aktif', phone: '', email: '', alamat: '' };
            if (id) {
                const found = state.data.anggota.find(a => a.id === id);
                if(found) item = {...found};
            }

            const modalHtml = `
                <div id="formModal" class="modal-overlay active">
                    <div class="modal-content p-6">
                        <div class="flex justify-between items-center mb-5">
                            <h3 class="text-lg font-bold text-gray-900">${id ? 'Edit Anggota' : 'Tambah Anggota Baru'}</h3>
                            <button onclick="document.getElementById('formModal').remove()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                        </div>
                        <form id="formAnggota" class="space-y-4">
                            <input type="hidden" id="ang_id" value="${escapeHTML(item.id || '')}">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap *</label>
                                <input type="text" id="ang_nama" value="${escapeHTML(item.nama)}" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Anggota</label>
                                    <select id="ang_jenis" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm">
                                        <option value="Utama" ${item.jenis==='Utama'?'selected':''}>Utama</option>
                                        <option value="Madya" ${item.jenis==='Madya'?'selected':''}>Madya</option>
                                        <option value="Pratama" ${item.jenis==='Pratama'?'selected':''}>Pratama</option>
                                        <option value="Kehormatan" ${item.jenis==='Kehormatan'?'selected':''}>Kehormatan</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                                    <select id="ang_status" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm">
                                        <option value="Aktif" ${item.status==='Aktif'?'selected':''}>Aktif</option>
                                        <option value="Tidak Aktif" ${item.status==='Tidak Aktif'?'selected':''}>Tidak Aktif</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">No. Handphone</label>
                                    <input type="text" id="ang_phone" value="${escapeHTML(item.phone)}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <input type="email" id="ang_email" value="${escapeHTML(item.email)}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
                                <textarea id="ang_alamat" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm">${escapeHTML(item.alamat)}</textarea>
                            </div>
                            <div class="pt-4 border-t border-gray-100 flex justify-end gap-3">
                                <button type="button" onclick="document.getElementById('formModal').remove()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition text-sm">Batal</button>
                                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition font-medium text-sm">Simpan Data</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            document.getElementById('formAnggota').addEventListener('submit', function(e) {
                e.preventDefault();
                const payload = {
                    id: document.getElementById('ang_id').value,
                    nama: document.getElementById('ang_nama').value,
                    jenis: document.getElementById('ang_jenis').value,
                    status: document.getElementById('ang_status').value,
                    phone: document.getElementById('ang_phone').value,
                    email: document.getElementById('ang_email').value,
                    alamat: document.getElementById('ang_alamat').value
                };
                
                document.getElementById('formModal').remove();
                saveAnggota(payload);
            });
        };

        function saveAnggota(data) {
            // Optimistic UI approach
            const isNew = !data.id;
            const tempId = data.id || 'TEMP-' + Date.now();
            if(isNew) data.id = tempId;
            data._isSyncing = true;
            
            const backup = JSON.stringify(state.data.anggota);
            
            if(isNew) {
                state.data.anggota.unshift(data);
            } else {
                const idx = state.data.anggota.findIndex(a => a.id === data.id);
                if(idx > -1) state.data.anggota[idx] = data;
            }
            
            if(state.activePage === 'anggota') renderAnggotaRows();

            gasRun('saveAnggota', state.token, data)
                .then(res => {
                    if(res.success) {
                        showToast('Data anggota berhasil disimpan');
                        // Silent refresh data
                        gasRun('getAnggota', state.token).then(r => {
                            if(r.success) {
                                state.data.anggota = r.data;
                                if(state.activePage === 'anggota') renderAnggotaRows();
                            }
                        });
                    } else {
                        throw new Error(res.message);
                    }
                })
                .catch(err => {
                    showToast(err.message || 'Gagal menyimpan data', 'error');
                    // Rollback
                    state.data.anggota = JSON.parse(backup);
                    if(state.activePage === 'anggota') renderAnggotaRows();
                });
        }

        // Protected Delete Flow
        let pendingDeleteId = null;
        let pendingDeleteType = null;

        window.confirmDeleteAnggota = function(id) {
            pendingDeleteId = id;
            pendingDeleteType = 'anggota';
            document.getElementById('confirmTitle').textContent = 'Hapus Anggota';
            document.getElementById('confirmMessage').textContent = 'Anda yakin ingin menghapus data anggota ini? Operasi ini memerlukan PIN Admin.';
            document.getElementById('confirmModal').classList.add('active');
        };

        window.closeConfirmModal = function() {
            document.getElementById('confirmModal').classList.remove('active');
            pendingDeleteId = null;
            pendingDeleteType = null;
        };

        document.getElementById('btnConfirmAction').addEventListener('click', function() {
            document.getElementById('confirmModal').classList.remove('active');
            // Ask for PIN
            document.getElementById('adminPinInput').value = '';
            document.getElementById('pinModal').classList.add('active');
            setTimeout(() => document.getElementById('adminPinInput').focus(), 100);
        });

        window.closePinModal = function() {
            document.getElementById('pinModal').classList.remove('active');
            pendingDeleteId = null;
        };

        document.getElementById('btnConfirmPin').addEventListener('click', function() {
            const pin = document.getElementById('adminPinInput').value;
            if(!pin || pin.length < 4) return showToast('Masukkan PIN yang valid', 'warning');
            
            const btn = this;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validasi...';
            btn.disabled = true;

            // Panggil API Delete protected by PIN
            gasRun('deleteDataWithPin', state.token, pendingDeleteType, pendingDeleteId, pin)
                .then(res => {
                    if(res.success) {
                        showToast('Data berhasil dihapus');
                        closePinModal();
                        // Remove from local state
                        if(pendingDeleteType === 'anggota') {
                            state.data.anggota = state.data.anggota.filter(a => a.id !== pendingDeleteId);
                            if(state.activePage === 'anggota') renderAnggotaRows();
                        }
                    } else {
                        showToast(res.message, 'error');
                    }
                })
                .catch(err => showToast(err.message, 'error'))
                .finally(() => {
                    btn.innerHTML = 'Konfirmasi';
                    btn.disabled = false;
                });
        });

        // ============================================================
        // EVENT HANDLERS
        // ============================================================
        function setupUIEvents() {
            // Sidebar toggle mobile
            document.getElementById('btnToggleSidebar').addEventListener('click', () => {
                document.getElementById('sidebar').classList.remove('sidebar-hidden');
                document.getElementById('sidebarOverlay').classList.remove('hidden');
            });
            
            document.getElementById('btnCloseSidebar').addEventListener('click', () => {
                document.getElementById('sidebar').classList.add('sidebar-hidden');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            });
            
            document.getElementById('sidebarOverlay').addEventListener('click', () => {
                document.getElementById('sidebar').classList.add('sidebar-hidden');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            });

            // PIN Input enter key
            document.getElementById('adminPinInput').addEventListener('keypress', function(e) {
                if(e.key === 'Enter') document.getElementById('btnConfirmPin').click();
            });
        }

        window.togglePassword = function(id) {
            const el = document.getElementById(id);
            if(el.type === 'password') {
                el.type = 'text';
            } else {
                el.type = 'password';
            }
        };

        // Placeholder untuk modul yang belum diimplementasikan full UI-nya demi batas token
        function loadInvoice(reqPage) {
            if (state.activePage !== reqPage) return;
            document.getElementById('mainContent').innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
                    <div class="h-16 w-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fas fa-file-invoice"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">Modul Invoice</h3>
                    <p class="text-gray-500 max-w-md mx-auto mb-6">Fungsionalitas frontend untuk manajemen Invoice lengkap dengan pembuatan item, print PDF, dan penandaan lunas.</p>
                    <button onclick="showToast('Fitur invoice terhubung ke API backend.', 'info')" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition">Simulasi Akses API</button>
                </div>
            `;
        }

    })();
    </script>
</body>
</html>
