<!DOCTYPE html>
<html lang="id" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Invoice & Kwitansi Anggota</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js & SheetJS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full font-sans antialiased text-gray-900" x-data="appState()" x-init="initApp()">

    <!-- ============================================================ -->
    <!-- KONFIGURASI APLIKASI -->
    <!-- ============================================================ -->
    <!-- PASTE URL GOOGLE APPS SCRIPT WEB APP ANDA DI SINI -->
    <script>
        const CONFIG = {
            SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxWNft5wN38ynRbhfwwn_P8GpT-GRn9UOkMcIrh4Ftlqor8EevL5F-9MaTycGdINsGR/exec"
        };
    </script>

    <!-- SETUP VIEW (Jika belum ada Super Admin) -->
    <template x-if="needsSetup">
        <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 bg-slate-900 h-screen">
            <div class="sm:mx-auto sm:w-full sm:max-w-md bg-white p-8 rounded-2xl shadow-2xl">
                <div class="text-center mb-6">
                    <i class="fa-solid fa-shield-halved text-4xl text-indigo-600 mb-2"></i>
                    <h2 class="text-2xl font-bold text-gray-900">Setup Super Admin</h2>
                    <p class="text-sm text-gray-500">Buat akun Administrator Utama</p>
                </div>
                <form class="space-y-4" @submit.prevent="setupSuperAdmin">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                        <input type="text" x-model="setupForm.nama" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" x-model="setupForm.username" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" x-model="setupForm.email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" x-model="setupForm.password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">PIN Admin (Untuk Hapus/Validasi)</label>
                        <input type="password" x-model="setupForm.pin" maxlength="6" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 text-white rounded-md font-medium hover:bg-indigo-700">Simpan & Buat Akun</button>
                    <div x-show="setupError" class="text-red-500 text-sm text-center mt-2" x-text="setupError"></div>
                </form>
            </div>
        </div>
    </template>

    <!-- LOGIN VIEW -->
    <template x-if="!needsSetup && !isLoggedIn">
        <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 bg-gradient-to-br from-blue-900 to-indigo-800 h-screen">
            <div class="sm:mx-auto sm:w-full sm:max-w-sm bg-white p-8 rounded-2xl shadow-2xl">
                <div class="text-center mb-6">
                    <i class="fa-solid fa-file-invoice-dollar text-4xl text-indigo-600 mb-2"></i>
                    <h2 class="text-2xl font-bold text-gray-900">Invoice & Kwitansi Anggota</h2>
                    <p class="text-sm text-gray-500 mt-1">Silakan masuk ke akun Anda</p>
                </div>
                <form class="space-y-4" @submit.prevent="login">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username atau Email</label>
                        <input type="text" x-model="loginForm.username" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" x-model="loginForm.password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 text-white rounded-md font-medium hover:bg-indigo-700">Masuk</button>
                    <div x-show="loginError" class="text-red-500 text-sm text-center mt-2" x-text="loginError"></div>
                </form>
            </div>
        </div>
    </template>

    <!-- DASHBOARD & MAIN APP -->
    <div x-show="isLoggedIn" class="flex h-screen overflow-hidden bg-gray-100" style="display: none;">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex">
            <div class="p-4 text-white font-bold text-lg border-b border-slate-800 flex items-center space-x-2">
                <i class="fa-solid fa-file-invoice text-indigo-400"></i>
                <span>Portal Anggota</span>
            </div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-1 text-sm">
                <a @click="currentTab = 'dashboard'" :class="{'bg-indigo-600 text-white': currentTab === 'dashboard'}" class="flex items-center space-x-3 px-3 py-2 rounded-md hover:bg-slate-800 cursor-pointer">
                    <i class="fa fa-home w-5"></i><span>Dashboard</span>
                </a>
                <div class="pt-4 pb-1 text-xs font-semibold text-slate-500 uppercase">Anggota</div>
                <a @click="currentTab = 'members'" :class="{'bg-indigo-600 text-white': currentTab === 'members'}" class="flex items-center space-x-3 px-3 py-2 rounded-md hover:bg-slate-800 cursor-pointer">
                    <i class="fa fa-users w-5"></i><span>Data Anggota</span>
                </a>
                <div class="pt-4 pb-1 text-xs font-semibold text-slate-500 uppercase">Pengaturan</div>
                <a @click="currentTab = 'audit_logs'" :class="{'bg-indigo-600 text-white': currentTab === 'audit_logs'}" class="flex items-center space-x-3 px-3 py-2 rounded-md hover:bg-slate-800 cursor-pointer">
                    <i class="fa fa-shield-halved w-5"></i><span>Audit Log</span>
                </a>
            </nav>
            <div class="p-4 border-t border-slate-800 flex justify-between items-center text-xs">
                <div>
                    <p class="font-semibold text-white" x-text="currentUser.name"></p>
                    <p class="text-indigo-400" x-text="currentUser.role"></p>
                </div>
                <button @click="logout" class="text-red-400 hover:text-red-300"><i class="fa fa-sign-out-alt text-lg"></i></button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6">
                <h1 class="text-xl font-bold text-gray-800 uppercase tracking-wide" x-text="currentTab.replace('_', ' ')"></h1>
            </header>
            <main class="p-6">
                <!-- TAB: DASHBOARD -->
                <div x-show="currentTab === 'dashboard'" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-xl shadow border border-gray-100 flex items-center space-x-4">
                            <div class="p-3 bg-blue-100 text-blue-600 rounded-lg"><i class="fa fa-users text-xl"></i></div>
                            <div>
                                <p class="text-sm text-gray-500">Total Anggota</p>
                                <h3 class="text-2xl font-bold" x-text="stats.totalAnggota || 0">0</h3>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-xl shadow border border-gray-100 flex items-center space-x-4">
                            <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><i class="fa fa-file-invoice-dollar text-xl"></i></div>
                            <div>
                                <p class="text-sm text-gray-500">Total Invoice</p>
                                <h3 class="text-2xl font-bold" x-text="stats.totalInvoice || 0">0</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB: ANGGOTA -->
                <div x-show="currentTab === 'members'" class="space-y-4">
                    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow">
                        <input type="text" x-model="memberSearch" placeholder="Cari Anggota..." class="border rounded-md px-3 py-2 text-sm w-1/3">
                        <button @click="openMemberModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm hover:bg-indigo-700"><i class="fa fa-plus mr-2"></i>Tambah Anggota</button>
                    </div>
                    <div class="bg-white rounded-xl shadow overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-gray-50 text-gray-700">
                                <tr>
                                    <th class="px-6 py-3 text-left">Nama</th>
                                    <th class="px-6 py-3 text-left">Jenis</th>
                                    <th class="px-6 py-3 text-left">Cabang</th>
                                    <th class="px-6 py-3 text-left">No. HP / Email</th>
                                    <th class="px-6 py-3 text-left">Status</th>
                                    <th class="px-6 py-3 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                <template x-for="m in filteredMembers" :key="m.id">
                                    <tr>
                                        <td class="px-6 py-4 font-medium text-gray-900" x-text="m.nama"></td>
                                        <td class="px-6 py-4" x-text="m.jenis_anggota"></td>
                                        <td class="px-6 py-4" x-text="m.cabang"></td>
                                        <td class="px-6 py-4"><span x-text="m.no_hp"></span><br><span class="text-xs text-gray-500" x-text="m.email"></span></td>
                                        <td class="px-6 py-4">
                                            <span class="px-2 py-1 text-xs font-semibold rounded-full" :class="m.status === 'Aktif' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'" x-text="m.status"></span>
                                        </td>
                                        <td class="px-6 py-4 text-right space-x-2">
                                            <button @click="deleteMember(m.id)" class="text-red-600 hover:text-red-900"><i class="fa fa-trash"></i></button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- TAB: AUDIT LOGS -->
                <div x-show="currentTab === 'audit_logs'" class="bg-white rounded-xl shadow overflow-hidden p-4">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-2 text-left">Waktu</th>
                                <th class="px-4 py-2 text-left">User</th>
                                <th class="px-4 py-2 text-left">Aksi</th>
                                <th class="px-4 py-2 text-left">Modul</th>
                                <th class="px-4 py-2 text-left">Deskripsi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <template x-for="log in auditLogs">
                                <tr>
                                    <td class="px-4 py-2 text-xs text-gray-500" x-text="new Date(log.timestamp).toLocaleString()"></td>
                                    <td class="px-4 py-2 font-medium" x-text="log.username"></td>
                                    <td class="px-4 py-2"><span class="px-2 py-0.5 text-xs bg-blue-50 text-blue-700 rounded" x-text="log.action"></span></td>
                                    <td class="px-4 py-2" x-text="log.module"></td>
                                    <td class="px-4 py-2 text-gray-600" x-text="log.description"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- SCRIPT APLIKASI UTAMA -->
    <script>
        function appState() {
            return {
                needsSetup: false,
                isLoggedIn: false,
                currentTab: 'dashboard',
                setupForm: { nama: '', username: '', email: '', password: '', pin: '' },
                setupError: '',
                loginForm: { username: '', password: '' },
                loginError: '',
                currentUser: {},
                stats: {},
                members: [],
                memberSearch: '',
                auditLogs: [],
                
                async initApp() {
                    const check = await this.callApi('check_setup');
                    if (check.success && check.needs_setup) {
                        this.needsSetup = true;
                        return;
                    }
                    const token = localStorage.getItem('app_token');
                    const user = localStorage.getItem('app_user');
                    if (token && user) {
                        this.isLoggedIn = true;
                        this.currentUser = JSON.parse(user);
                        this.loadData();
                    }
                },
                
                async callApi(action, data = {}) {
                    const token = localStorage.getItem('app_token');
                    try {
                        const res = await fetch(CONFIG.SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action, token, ...data })
                        });
                        return await res.json();
                    } catch(e) {
                        alert("Gagal menghubungi server Apps Script.");
                        return { success: false };
                    }
                },
                
                async setupSuperAdmin() {
                    const res = await this.callApi('setup_super_admin', this.setupForm);
                    if (res.success) {
                        alert(res.message);
                        this.needsSetup = false;
                    } else {
                        this.setupError = res.message;
                    }
                },
                
                async login() {
                    const res = await this.callApi('login', this.loginForm);
                    if (res.success) {
                        localStorage.setItem('app_token', res.token);
                        localStorage.setItem('app_user', JSON.stringify(res.user));
                        this.isLoggedIn = true;
                        this.currentUser = res.user;
                        this.loadData();
                    } else {
                        this.loginError = res.message;
                    }
                },
                
                logout() {
                    this.callApi('logout');
                    localStorage.removeItem('app_token');
                    localStorage.removeItem('app_user');
                    this.isLoggedIn = false;
                },
                
                loadData() {
                    this.callApi('get_dashboard_stats').then(res => { if(res.success) this.stats = res.data; });
                    this.callApi('get_members').then(res => { if(res.success) this.members = res.data; });
                    this.callApi('get_audit_logs').then(res => { if(res.success) this.auditLogs = res.data; });
                },
                
                get filteredMembers() {
                    if (!this.memberSearch) return this.members;
                    return this.members.filter(m => m.nama.toLowerCase().includes(this.memberSearch.toLowerCase()) || m.cabang.toLowerCase().includes(this.memberSearch.toLowerCase()));
                },
                
                deleteMember(id) {
                    if (confirm("Apakah Anda yakin ingin menghapus data anggota ini?")) {
                        this.callApi('delete_member', { id }).then(res => {
                            alert(res.message);
                            if (res.success) this.loadData();
                        });
                    }
                }
            }
        }
    </script>
</body>
</html>
