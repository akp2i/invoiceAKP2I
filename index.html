<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Invoice & Kwitansi Anggota</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS untuk Excel Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF & html2canvas untuk Export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="h-full font-sans antialiased text-slate-900 flex flex-col" id="app">

    <!-- ============================================================ -->
    <!-- KONFIGURASI APLIKASI -->
    <!-- ============================================================ -->
    <script>
        // PASTE URL GOOGLE APPS SCRIPT WEB APP ANDA DI SINI
        const CONFIG = {
            SCRIPT_URL: "PASTE_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"
        };
    </script>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl shadow-xl flex items-center space-x-4">
            <i class="fa-solid fa-spinner fa-spin text-indigo-600 text-3xl"></i>
            <span class="font-medium text-slate-700" id="loading-text">Memproses data...</span>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

    <!-- MAIN APP CONTAINER -->
    <div class="flex h-full overflow-hidden w-full" id="main-app-container">
        <!-- Akan dirender dinamis via JS -->
    </div>

    <!-- SCRIPT UTAMA FRONTEND -->
    <script>
        // ============================================================
        // GLOBAL STATE & INITIALIZATION
        // ============================================================
        const AppState = {
            token: localStorage.getItem("app_token") || null,
            user: JSON.parse(localStorage.getItem("app_user") || "null"),
            currentMenu: "dashboard",
            dashboardData: {},
            anggotaList: [],
            customFields: [],
            invoices: [],
            receipts: [],
            bankAccounts: [],
            companySettings: {},
            users: [],
            auditLogs: []
        };

        window.addEventListener("DOMContentLoaded", () => {
            initApp();
        });

        async function initApp() {
            if (CONFIG.SCRIPT_URL.includes("PASTE_GOOGLE_APPS_SCRIPT")) {
                renderSetupConfigError();
                return;
            }

            try {
                showLoading(true);
                const setupRes = await callAPI("check_setup", "GET");
                if (setupRes.success && setupRes.data === true) {
                    renderInitialSetupPage();
                    showLoading(false);
                    return;
                }
            } catch (e) {
                console.error(e);
            }

            showLoading(false);
            if (!AppState.token || !AppState.user) {
                renderLoginPage();
            } else {
                renderDashboardLayout();
            }
        }

        function renderSetupConfigError() {
            document.getElementById("main-app-container").innerHTML = `
                <div class="m-auto max-w-lg p-8 bg-white shadow-xl rounded-2xl text-center">
                    <i class="fa-solid fa-triangle-exclamation text-amber-500 text-5xl mb-4"></i>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Konfigurasi URL Belum Diisi</h2>
                    <p class="text-slate-600 mb-6">Silakan buka file <code>index.html</code> dan ganti nilai <code>CONFIG.SCRIPT_URL</code> dengan URL Web App Google Apps Script Anda.</p>
                </div>
            `;
        }

        function showLoading(show, text = "Memproses...") {
            const el = document.getElementById("loading-overlay");
            document.getElementById("loading-text").innerText = text;
            if (show) el.classList.remove("hidden");
            else el.classList.add("hidden");
        }

        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            let bg = "bg-emerald-600";
            let icon = "fa-circle-check";
            if (type === "error") { bg = "bg-rose-600"; icon = "fa-circle-xmark"; }
            if (type === "warning") { bg = "bg-amber-600"; icon = "fa-triangle-exclamation"; }

            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 transition transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="text-sm font-medium">${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove("translate-y-2", "opacity-0"), 50);
            setTimeout(() => {
                toast.classList.add("translate-y-2", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function callAPI(action, method = "GET", payload = {}) {
            let url = CONFIG.SCRIPT_URL + "?action=" + action + "&token=" + (AppState.token || "");
            let options = { method: method };
            if (method === "POST") {
                options.body = JSON.stringify({ action: action, token: AppState.token, data: payload.data || payload, pin: payload.pin || "" });
            }
            try {
                const res = await fetch(url, options);
                const json = await res.json();
                if (json.unauthorized) {
                    handleUnauthorized();
                    throw new Error("Session berakhir.");
                }
                if (!json.success) throw new Error(json.message || "Terjadi kesalahan pada server.");
                return json;
            } catch (err) {
                showToast(err.message, "error");
                throw err;
            }
        }

        function handleUnauthorized() {
            localStorage.clear();
            AppState.token = null;
            AppState.user = null;
            renderLoginPage();
            showToast("Session telah berakhir. Silakan login kembali.", "warning");
        }

        // ============================================================
        // SETUP AWAL & LOGIN PAGE
        // ============================================================
        function renderInitialSetupPage() {
            document.getElementById("main-app-container").innerHTML = `
                <div class="m-auto w-full max-w-md p-8 bg-white shadow-2xl rounded-2xl border border-slate-100">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800">Setup Super Admin</h2>
                        <p class="text-sm text-slate-500 mt-1">Belum ada akun Administrator. Buat Super Admin pertama.</p>
                    </div>
                    <form onsubmit="submitInitialSetup(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nama Lengkap</label>
                            <input type="text" id="setup-nama" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username</label>
                            <input type="text" id="setup-username" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email</label>
                            <input type="email" id="setup-email" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                            <input type="password" id="setup-password" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">PIN Admin (Untuk Hapus/Operasi Sensitif)</label>
                            <input type="password" maxlength="6" id="setup-pin" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="Contoh: 123456">
                        </div>
                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg transition duration-200">Simpan & Buat Super Admin</button>
                    </form>
                </div>
            `;
        }

        async function submitInitialSetup(e) {
            e.preventDefault();
            showLoading(true, "Membuat Super Admin...");
            try {
                const payload = {
                    nama: document.getElementById("setup-nama").value,
                    username: document.getElementById("setup-username").value,
                    email: document.getElementById("setup-email").value,
                    password: document.getElementById("setup-password").value,
                    pin: document.getElementById("setup-pin").value
                };
                const res = await callAPI("setup_superadmin", "POST", payload);
                showToast(res.message);
                initApp();
            } catch (err) {
                // error handled
            } finally {
                showLoading(false);
            }
        }

        function renderLoginPage() {
            document.getElementById("main-app-container").innerHTML = `
                <div class="m-auto w-full max-w-md p-8 bg-white shadow-2xl rounded-2xl border border-slate-100">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800">Invoice & Kwitansi Anggota</h2>
                        <p class="text-sm text-slate-500 mt-1">Silakan login untuk masuk ke aplikasi</p>
                    </div>
                    <form onsubmit="submitLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username / Email</label>
                            <input type="text" id="login-user" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                            <input type="password" id="login-pass" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg transition duration-200">Login</button>
                    </form>
                </div>
            `;
        }

        async function submitLogin(e) {
            e.preventDefault();
            showLoading(true, "Autentikasi...");
            try {
                const payload = {
                    username: document.getElementById("login-user").value,
                    password: document.getElementById("login-pass").value
                };
                const res = await callAPI("login", "POST", payload);
                AppState.token = res.data.token;
                AppState.user = res.data.user;
                localStorage.setItem("app_token", AppState.token);
                localStorage.setItem("app_user", JSON.stringify(AppState.user));
                showToast("Login berhasil! Selamat datang, " + AppState.user.name);
                renderDashboardLayout();
            } catch (err) {
                // error handled
            } finally {
                showLoading(false);
            }
        }

        async function logout() {
            showLoading(true, "Keluar...");
            try {
                await callAPI("logout", "POST", { token: AppState.token });
            } catch (e) {}
            localStorage.clear();
            AppState.token = null;
            AppState.user = null;
            showLoading(false);
            renderLoginPage();
            showToast("Anda telah keluar.");
        }

        // ============================================================
        // DASHBOARD & LAYOUT UTAMA
        // ============================================================
        async function renderDashboardLayout() {
            showLoading(true, "Memuat Dashboard...");
            try {
                const [dashRes, anggotaRes, invRes, rcpRes, bankRes, compRes] = await Promise.all([
                    callAPI("get_dashboard", "GET"),
                    callAPI("get_anggota", "GET"),
                    callAPI("get_invoices", "GET"),
                    callAPI("get_receipts", "GET"),
                    callAPI("get_bank_accounts", "GET"),
                    callAPI("get_company_settings", "GET")
                ]);

                AppState.dashboardData = dashRes.data;
                AppState.anggotaList = anggotaRes.data;
                AppState.invoices = invRes.data;
                AppState.receipts = rcpRes.data;
                AppState.bankAccounts = bankRes.data;
                AppState.companySettings = compRes.data;
            } catch (e) {
                showLoading(false);
                return;
            }
            showLoading(false);

            const container = document.getElementById("main-app-container");
            container.innerHTML = `
                <!-- SIDEBAR -->
                <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 border-r border-slate-800">
                    <div class="p-5 flex items-center space-x-3 border-b border-slate-800">
                        <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow">
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-white text-sm">Invoice Anggota</h1>
                            <span class="text-xs text-slate-400">${AppState.user.role}</span>
                        </div>
                    </div>
                    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1 text-sm">
                        <a href="#" onclick="switchMenu('dashboard')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'dashboard' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></a>
                        
                        <div class="pt-4 pb-1 px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Anggota</div>
                        <a href="#" onclick="switchMenu('anggota')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'anggota' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-users w-5"></i><span>Data Anggota</span></a>
                        <a href="#" onclick="switchMenu('import_anggota')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'import_anggota' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-file-excel w-5"></i><span>Import Anggota</span></a>

                        <div class="pt-4 pb-1 px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Transaksi</div>
                        <a href="#" onclick="switchMenu('invoice')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'invoice' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-file-invoice w-5"></i><span>Invoice</span></a>
                        <a href="#" onclick="switchMenu('kwitansi')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'kwitansi' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-receipt w-5"></i><span>Kwitansi</span></a>

                        <div class="pt-4 pb-1 px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Pengaturan</div>
                        <a href="#" onclick="switchMenu('company')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'company' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-building w-5"></i><span>Data Perusahaan</span></a>
                        <a href="#" onclick="switchMenu('bank')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'bank' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-building-columns w-5"></i><span>Rekening Bank</span></a>
                        <a href="#" onclick="switchMenu('custom_fields')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'custom_fields' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-list-check w-5"></i><span>Custom Field</span></a>

                        ${AppState.user.role === 'Super Admin' || AppState.user.role === 'Admin' ? `
                        <div class="pt-4 pb-1 px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Administrasi</div>
                        <a href="#" onclick="switchMenu('users')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'users' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-user-shield w-5"></i><span>Manajemen User</span></a>
                        <a href="#" onclick="switchMenu('audit')" class="menu-link flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition ${AppState.currentMenu === 'audit' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-clock-rotate-left w-5"></i><span>Audit Log</span></a>
                        ` : ''}
                    </nav>
                    <div class="p-4 border-t border-slate-800">
                        <button onclick="logout()" class="w-full flex items-center justify-center space-x-2 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white rounded-xl transition text-sm font-medium"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
                    </div>
                </aside>

                <!-- MAIN CONTENT AREA -->
                <div class="flex-1 flex flex-col overflow-hidden">
                    <!-- TOPBAR -->
                    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shadow-sm">
                        <div class="flex items-center space-x-3">
                            <h2 class="text-lg font-bold text-slate-800 uppercase tracking-wide" id="page-title">Dashboard</h2>
                        </div>
                        <div class="flex items-center space-x-4">
                            <span class="text-sm font-semibold text-slate-700"><i class="fa-solid fa-user-circle text-indigo-600 mr-2"></i>${AppState.user.name}</span>
                        </div>
                    </header>

                    <!-- CONTENT DYNAMIC -->
                    <main class="flex-1 overflow-y-auto p-6 bg-slate-50" id="main-content">
                        <!-- Rendered by menu switcher -->
                    </main>
                </div>
            `;
            renderCurrentMenuContent();
        }

        function switchMenu(menu) {
            AppState.currentMenu = menu;
            document.querySelectorAll(".menu-link").forEach(el => el.classList.remove("bg-indigo-600", "text-white", "font-semibold"));
            renderDashboardLayout();
        }

        function renderCurrentMenuContent() {
            const container = document.getElementById("main-content");
            document.getElementById("page-title").innerText = AppState.currentMenu.replace("_", " ");

            switch(AppState.currentMenu) {
                case "dashboard": renderDashboardView(container); break;
                case "anggota": renderAnggotaView(container); break;
                case "import_anggota": renderImportAnggotaView(container); break;
                case "invoice": renderInvoiceView(container); break;
                case "kwitansi": renderKwitansiView(container); break;
                case "company": renderCompanyView(container); break;
                case "bank": renderBankView(container); break;
                case "custom_fields": renderCustomFieldsView(container); break;
                case "users": renderUsersView(container); break;
                case "audit": renderAuditView(container); break;
                default: container.innerHTML = `<p>Menu belum tersedia.</p>`;
            }
        }

        // ============================================================
        // DASHBOARD VIEW
        // ============================================================
        function renderDashboardView(container) {
            const d = AppState.dashboardData;
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-users"></i></div>
                            <div>
                                <p class="text-xs font-semibold uppercase text-slate-400">Total Anggota</p>
                                <h3 class="text-2xl font-bold text-slate-800">${d.totalAnggota}</h3>
                                <span class="text-xs text-emerald-600 font-medium">${d.anggotaAktif} Aktif</span>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-file-invoice"></i></div>
                            <div>
                                <p class="text-xs font-semibold uppercase text-slate-400">Total Invoice</p>
                                <h3 class="text-2xl font-bold text-slate-800">${d.totalInvoice}</h3>
                                <span class="text-xs text-amber-600 font-medium">${d.invBelumDibayar} Belum Bayar</span>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-wallet"></i></div>
                            <div>
                                <p class="text-xs font-semibold uppercase text-slate-400">Total Pembayaran</p>
                                <h3 class="text-xl font-bold text-slate-800">Rp ${Number(d.totalPembayaran || 0).toLocaleString('id-ID')}</h3>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-receipt"></i></div>
                            <div>
                                <p class="text-xs font-semibold uppercase text-slate-400">Total Kwitansi</p>
                                <h3 class="text-2xl font-bold text-slate-800">${d.totalKwitansi}</h3>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="font-bold text-slate-800 mb-4 flex items-center"><i class="fa-solid fa-file-invoice mr-2 text-indigo-600"></i>Invoice Terbaru</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-slate-50 text-slate-600 border-b">
                                        <tr><th class="p-3">Nomor</th><th class="p-3">Total</th><th class="p-3">Status</th></tr>
                                    </thead>
                                    <tbody class="divide-y">
                                        ${(d.recentInvoices || []).map(i => `
                                            <tr>
                                                <td class="p-3 font-medium">${i.nomor_invoice}</td>
                                                <td class="p-3">Rp ${Number(i.total).toLocaleString('id-ID')}</td>
                                                <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${i.status === 'Dibayar' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${i.status}</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>

        function handleExcelUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.SheetNames[0];
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
                
                showLoading(true, "Mengimport data...");
                let successCount = 0;
                for (let r of rows) {
                    try {
                        await callAPI("save_anggota", "POST", {
                            nama: r.Nama || r.nama || "Tanpa Nama",
                            jenis_anggota: r.Jenis || "Utama",
                            status: r.Status || "Aktif",
                            cabang: r.Cabang || "",
                            no_handphone: String(r.NoHP || r.Telepon || ""),
                            email: r.Email || "",
                            alamat: r.Alamat || ""
                        });
                        successCount++;
                    } catch (err) {}
                }
                showLoading(false);
                showToast(`Import selesai! Berhasil menyimpan ${successCount} data.`);
                const anggotaRes = await callAPI("get_anggota", "GET");
                AppState.anggotaList = anggotaRes.data;
                switchMenu('anggota');
            };
            reader.readAsArrayBuffer(file);
        }

                const qty = Number(row.querySelector(".item-qty").value);
                const price = Number(row.querySelector(".item-price").value);
                const sub = qty * price;
                subtotal += sub;
                items.push({ deskripsi: desc, qty: qty, harga_satuan: price, subtotal: sub });

                jatuh_tempo: document.getElementById("inv-jatuh-tempo").value,

                total: subtotal,

                catatan: "Terima kasih atas kontribusi Anda.",

                </div>
            `;
        }

        // ============================================================
        // PENGATURAN LAINNYA (COMPANY, BANK, USERS, AUDIT)
        // ============================================================
        function renderCompanyView(container) {
            const c = AppState.companySettings || {};
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 max-w-2xl mx-auto space-y-6">
                    <h3 class="font-bold text-slate-800 text-lg">Pengaturan Data Perusahaan / Organisasi</h3>
                    <form onsubmit="saveCompanySubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nama Organisasi</label>
                            <input type="text" id="comp-nama" value="${c.nama_perusahaan || ''}" required class="w-full px-4 py-2 border rounded-xl text-sm outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Kota</label>
                                <input type="text" id="comp-kota" value="${c.kota || ''}" class="w-full px-4 py-2 border rounded-xl text-sm outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">No Telepon</label>
                                <input type="text" id="comp-telp" value="${c.no_telepon || ''}" class="w-full px-4 py-2 border rounded-xl text-sm outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Alamat</label>
                            <textarea id="comp-alamat" rows="2" class="w-full px-4 py-2 border rounded-xl text-sm outline-none">${c.alamat || ''}</textarea>
                        </div>
                        <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-semibold shadow">Simpan Perubahan</button>
                    </form>
                </div>
            `;
        }

        async function saveCompanySubmit(e) {
            e.preventDefault();
            showLoading(true, "Menyimpan Data Perusahaan...");
            try {
                const payload = {
                    nama_perusahaan: document.getElementById("comp-nama").value,
                    kota: document.getElementById("comp-kota").value,
                    no_telepon: document.getElementById("comp-telp").value,
                    alamat: document.getElementById("comp-alamat").value
                };
                const res = await callAPI("save_company_settings", "POST", payload);
                showToast(res.message);
            } catch (err) {} finally { showLoading(false); }
        }

        function renderBankView(container) {
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-6">
                    <h3 class="font-bold text-slate-800">Daftar Rekening Bank</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-600 border-b">
                                <tr><th class="p-3">Bank</th><th class="p-3">Nomor Rekening</th><th class="p-3">Atas Nama</th></tr>
                            </thead>
                            <tbody class="divide-y">
                                ${AppState.bankAccounts.map(b => `
                                    <tr><td class="p-3 font-semibold">${b.nama_bank}</td><td class="p-3">${b.nomor_rekening}</td><td class="p-3">${b.atas_nama}</td></tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderCustomFieldsView(container) {
            container.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6"><h3 class="font-bold text-slate-800 mb-2">Custom Field Anggota</h3><p class="text-sm text-slate-500">Kelola field tambahan dinamis untuk data anggota.</p></div>`;
        }

        function renderUsersView(container) {
            container.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6"><h3 class="font-bold text-slate-800 mb-2">Manajemen User</h3><p class="text-sm text-slate-500">Daftar pengguna sistem dengan Role-Based Access Control.</p></div>`;
        }

        function renderAuditView(container) {
            container.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6"><h3 class="font-bold text-slate-800 mb-2">Audit Log Aktivitas</h3><p class="text-sm text-slate-500">Pencatatan seluruh aktivitas penting pengguna.</p></div>`;
        }
    </script>
</body>
</html>
